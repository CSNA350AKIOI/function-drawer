<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="在线函数绘制器：输入表达式即可绘图，支持拖动坐标轴、平移、缩放、PNG 导出。">
<title>函数绘制器 · Function Drawer</title>
<style>
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --line:#e5e9f2;
    --line-strong:#d5dbe8;
    --ink:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --accent-soft:#eff4ff;
    --danger:#e11d48;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);background:var(--bg);overflow:hidden;
  }
  .app{display:flex;height:100vh;height:100dvh}

  /* ---------- 侧栏 ---------- */
  .panel{
    width:328px;flex:0 0 328px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:14px;padding:18px 18px 22px;overflow-y:auto;z-index:2;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .logo{
    width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(140deg,#2563eb,#7c3aed);color:#fff;font:italic 600 24px/1 Georgia,"Times New Roman",serif;
    box-shadow:0 6px 16px -6px rgba(37,99,235,.7);
  }
  .brand h1{margin:0;font-size:16px;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  .funcs{display:flex;flex-direction:column;gap:10px}
  .fn-row{
    display:grid;grid-template-columns:10px 30px 1fr auto auto;align-items:center;gap:6px;
    background:#fbfcfe;border:1px solid var(--line);border-radius:var(--radius);padding:7px 8px;
    transition:border-color .15s,box-shadow .15s,background .15s;
  }
  .fn-row:focus-within{border-color:#bcd0fb;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
  .fn-row.off{opacity:.5}
  .chip{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
  .name{font:12px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);text-align:center}
  .src{
    width:100%;min-width:0;border:0;background:transparent;outline:none;padding:5px 2px;
    font:14px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;color:var(--ink);
  }
  .src::placeholder{color:#b6bdcb}
  .icon{
    width:26px;height:26px;border:0;border-radius:8px;background:transparent;color:#9aa3b2;cursor:pointer;
    font-size:13px;line-height:1;display:grid;place-items:center;transition:background .15s,color .15s;
  }
  .icon:hover{background:#eef1f7;color:var(--ink)}
  .icon.del:hover{background:#fee8ee;color:var(--danger)}
  .fn-err{
    margin:-4px 2px 0;font-size:11.5px;color:var(--danger);display:none;word-break:break-word;
  }
  .fn-err.show{display:block}

  .row{display:flex;gap:8px}
  .btn{
    flex:1;appearance:none;border:1px solid var(--line-strong);background:#fff;color:var(--ink);
    border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer;transition:.15s;
    font-family:inherit;white-space:nowrap;
  }
  .btn:hover{background:#f7f9fd;border-color:#c3ccdd}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.primary:hover{background:#1d4ed8;border-color:#1d4ed8}
  select.btn{padding-right:6px;text-overflow:ellipsis}
  .divider{height:1px;background:var(--line);margin:2px 0}

  .tips{font-size:12px;line-height:1.9;color:var(--muted);display:flex;flex-direction:column;gap:1px}
  .tips kbd{
    display:inline-block;background:#f2f4f9;border:1px solid var(--line-strong);border-bottom-width:2px;
    border-radius:6px;padding:0 5px;font:11px/1.65 ui-monospace,Menlo,Consolas,monospace;color:#4b5563;
  }
  .foot{margin-top:auto;font-size:11px;color:#a3abbb;line-height:1.6}

  /* ---------- 画布 ---------- */
  .stage{position:relative;flex:1;min-width:0;background:#fff;overflow:hidden}
  canvas{
    display:block;position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;cursor:grab;outline:none;
  }
  canvas.grabbing{cursor:grabbing}
  canvas.ns{cursor:ns-resize}
  canvas.ew{cursor:ew-resize}

  .zoombtns{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
  .zoombtns button{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);color:#4b5563;cursor:pointer;
    font-size:17px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow);transition:.15s;
  }
  .zoombtns button:hover{background:#fff;color:var(--accent);border-color:#bcd0fb}
  .zoombtns button:active{transform:scale(.94)}

  .pill{
    position:absolute;z-index:3;padding:6px 11px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.88);backdrop-filter:blur(8px);box-shadow:var(--shadow);
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);
    pointer-events:none;user-select:none;
  }
  #status{left:14px;bottom:14px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #readout{
    left:14px;bottom:52px;font-weight:600;font-size:12.5px;
    max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #readout.hidden{display:none}
  #badge{left:14px;top:14px;color:#6b7280;transition:opacity .6s,transform .6s}
  #badge.hide{opacity:0;transform:translateY(-6px)}

  @media (max-width:780px){
    .app{flex-direction:column-reverse}
    .panel{width:auto;flex:0 0 auto;max-height:48vh;border-right:0;border-top:1px solid var(--line);padding:14px}
    .tips,.foot{display:none}
    .stage{flex:1 1 auto}
    #badge{display:none}
    #readout{bottom:50px}
    .src{font-size:16px}          /* 避免 iOS 聚焦输入框时自动放大页面 */
  }
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <div class="logo">ƒ</div>
      <div>
        <h1>函数绘制器</h1>
        <p>拖拽平移 · 滚轮缩放 · 拖动坐标轴</p>
      </div>
    </header>

    <div class="funcs" id="funcs"></div>
    <div class="fn-err" id="globalErr" style="margin-top:-6px"></div>

    <div class="row">
      <button class="btn primary" id="addBtn">+ 添加函数</button>
      <select class="btn" id="presets" title="插入一个示例函数">
        <option value="">示例…</option>
        <option value="sin(x)">sin(x)</option>
        <option value="cos(2x)">cos(2x)</option>
        <option value="tan(x)">tan(x)</option>
        <option value="x^2/4 - 2">x^2/4 - 2</option>
        <option value="x^3/6 - x">x^3/6 - x</option>
        <option value="1/x">1/x</option>
        <option value="sqrt(x)">sqrt(x)</option>
        <option value="abs(x) - 2">abs(x) - 2</option>
        <option value="exp(-x^2)">exp(-x^2)</option>
        <option value="sin(x)/x">sin(x)/x</option>
        <option value="sin(3x)*exp(-x^2/9)">sin(3x)*exp(-x²/9)</option>
        <option value="ln(abs(x))">ln(abs(x))</option>
        <option value="sqrt(25-x^2)">sqrt(25-x²) 半圆</option>
        <option value="asin(sin(x))">asin(sin(x))</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="row">
      <button class="btn" id="resetBtn">重置视图</button>
      <button class="btn" id="pngBtn">导出 PNG</button>
    </div>

    <div class="tips">
      <div><kbd>拖拽空白处</kbd> 平移整个坐标系</div>
      <div><kbd>拖拽坐标轴</kbd> 单独移动 x 轴 / y 轴</div>
      <div><kbd>滚轮</kbd> 缩放（以光标为中心）</div>
      <div><kbd>Shift</kbd>+<kbd>滚轮</kbd> 只缩放 x 轴 · <kbd>Alt</kbd>+<kbd>滚轮</kbd> 只缩放 y 轴</div>
      <div><kbd>双击</kbd> 放大 · <kbd>方向键</kbd> 平移</div>
      <div><kbd>+</kbd> / <kbd>-</kbd> 缩放 · <kbd>0</kbd> 重置视图</div>
      <div><kbd>鼠标悬停</kbd> 显示曲线取值</div>
      <div><kbd>触屏</kbd> 单指拖动 · 双指捏合缩放</div>
    </div>

    <div class="foot">支持 sin cos tan ln log exp sqrt abs 等函数，pi / e 常量，<br>以及 2x、(x+1)(x-1)、(sin x)² 这类简写。</div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv" tabindex="0" aria-label="函数图像画布"></canvas>
    <div class="zoombtns">
      <button id="zin" title="放大 (+)" aria-label="放大">+</button>
      <button id="zout" title="缩小 (−)" aria-label="缩小">−</button>
      <button id="zreset" title="重置视图 (0)" aria-label="重置视图">⟲</button>
    </div>
    <div class="pill" id="readout"></div>
    <div class="pill" id="status">加载中…</div>
    <div class="pill" id="badge">滚轮缩放 · 拖动平移 · 拖动坐标轴可单独移动</div>
  </main>
</div>

<script>
/* =====================================================================
   数学内核：表达式解析 / 编译（无 DOM 依赖，可单独测试）
   ===================================================================== */
/* ===== MATH-CORE-START ===== */
var MATH_CONSTS = {
  pi: Math.PI, 'π': Math.PI, PI: Math.PI,
  tau: 2 * Math.PI, 'τ': 2 * Math.PI,
  e: Math.E, E: Math.E,
  phi: (1 + Math.sqrt(5)) / 2, 'φ': (1 + Math.sqrt(5)) / 2,
  inf: Infinity, Infinity: Infinity
};

/* 函数表：js = Math 上的名字；argc = [最少, 最多] 个参数；build 用于特殊构造 */
var MATH_FUNCS = (function () {
  var out = {};
  function simple(name, js, argc) {
    out[name] = { js: js, min: argc[0], max: argc[1] };
  }
  simple('sin', 'Math.sin', [1, 1]); simple('cos', 'Math.cos', [1, 1]); simple('tan', 'Math.tan', [1, 1]);
  simple('asin', 'Math.asin', [1, 1]); simple('acos', 'Math.acos', [1, 1]); simple('atan', 'Math.atan', [1, 1]);
  simple('sinh', 'Math.sinh', [1, 1]); simple('cosh', 'Math.cosh', [1, 1]); simple('tanh', 'Math.tanh', [1, 1]);
  simple('asinh', 'Math.asinh', [1, 1]); simple('acosh', 'Math.acosh', [1, 1]); simple('atanh', 'Math.atanh', [1, 1]);
  simple('sqrt', 'Math.sqrt', [1, 1]); simple('cbrt', 'Math.cbrt', [1, 1]);
  simple('abs', 'Math.abs', [1, 1]); simple('sign', 'Math.sign', [1, 1]);
  simple('floor', 'Math.floor', [1, 1]); simple('ceil', 'Math.ceil', [1, 1]);
  simple('round', 'Math.round', [1, 1]); simple('trunc', 'Math.trunc', [1, 1]);
  simple('exp', 'Math.exp', [1, 1]);
  simple('ln', 'Math.log', [1, 1]);
  simple('log', 'Math.log10', [1, 1]); simple('lg', 'Math.log10', [1, 1]);
  simple('log10', 'Math.log10', [1, 1]); simple('log2', 'Math.log2', [1, 1]);
  simple('min', 'Math.min', [1, 8]); simple('max', 'Math.max', [1, 8]);
  simple('pow', 'Math.pow', [2, 2]); simple('atan2', 'Math.atan2', [2, 2]);
  simple('hypot', 'Math.hypot', [1, 8]);

  /* 特殊：可带 1~2 个参数的 log / 常见的非线性函数 */
  out.log = {
    min: 1, max: 2,
    build: function (a) {
      if (a.length === 1) return 'Math.log10(' + a[0] + ')';
      return '(Math.log(' + a[0] + ')/Math.log(' + a[1] + '))';
    }
  };
  out.ln = { min: 1, max: 1, build: function (a) { return 'Math.log(' + a[0] + ')'; } };
  out.mod = { min: 2, max: 2, build: function (a) { return '(((' + a[0] + ')%(' + a[1] + '))+' + a[1] + ')%(' + a[1] + ')'; } };
  out.sec = { min: 1, max: 1, build: function (a) { return '(1/Math.cos(' + a[0] + '))'; } };
  out.csc = { min: 1, max: 1, build: function (a) { return '(1/Math.sin(' + a[0] + '))'; } };
  out.cot = { min: 1, max: 1, build: function (a) { return '(1/Math.tan(' + a[0] + '))'; } };
  return out;
})();

/* 输入归一化：全角字符、中文标点、各种减号乘号 → ASCII，顺便支持 √ */
function mathNormalize(src) {
  return String(src == null ? '' : src)
    .replace(/[\uFF10-\uFF19]/g, function (c) {           /* 全角数字 */
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    })
    .replace(/[\u2212\u2013\u2014\u2015\u30FC\uFF0D]/g, '-')  /* − – — ― ー － */
    .replace(/[\u00D7\u22C5\u2219\u00B7\uFF0A\uFF3E\u204E]/g, '*') /* × ⋅ ∙ · ＊ ＾? */
    .replace(/[\u00F7\u2215\uFF0F]/g, '/')                 /* ÷ ∕ ／ */
    .replace(/[\uFF0B\u2795]/g, '+')
    .replace(/[\uFF08\u3010\uFF3B[]/g, '(')                /* （ 【 [ */
    .replace(/[\uFF09\u3011\uFF3D\]]/g, ')')               /* ） 】 ] */
    .replace(/[\uFF0C\u3001\uFF64]/g, ',')                 /* ， 、 ､ */
    .replace(/[\u221A\u221B]/g, function (c) {            /* √ ∛ → 函数名，并留一个空格避免 √x 变成 sqrtx */
      return (c === '\u221B' ? 'cbrt ' : 'sqrt ');
    })
    .replace(/[\uFF3E]/g, '^')
    .replace(/[\u2018\u2019\u201C\u201D\u00B4\u0060]/g, '');  /* 引号 */
}

function mathTokenize(src) {
  src = mathNormalize(src);
  var tokens = [];
  var i = 0;
  var isDigit = function (c) { return c >= '0' && c <= '9'; };
  var isAlpha = function (c) { return /[A-Za-z_\u0370-\u03ff]/.test(c); };   /* 拉丁 + 希腊（π τ φ…） */
  var isAlnum = function (c) { return /[A-Za-z0-9_\u0370-\u03ff]/.test(c); };
  while (i < src.length) {
    var c = src[i];
    if (c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === '\u3000') { i++; continue; }
    if (isDigit(c) || (c === '.' && isDigit(src[i + 1]))) {
      var m = /^(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?/.exec(src.slice(i));
      if (!m) throw new Error('无法识别的数字');
      tokens.push({ t: 'num', v: m[0] });
      i += m[0].length;
      continue;
    }
    if (isAlpha(c)) {
      var j = i + 1;
      while (j < src.length && isAlnum(src[j])) j++;
      tokens.push({ t: 'id', v: src.slice(i, j) });
      i = j;
      continue;
    }
    if (c === '*' && src[i + 1] === '*') { tokens.push({ t: 'op', v: '^' }); i += 2; continue; }   /* ** 作为幂 */
    if ('+-*/^(),'.indexOf(c) >= 0) { tokens.push({ t: 'op', v: c }); i++; continue; }
    throw new Error('无法识别的字符 “' + c + '”');
  }
  return tokens;
}

/* 递归下降解析：直接生成 JS 源码字符串 */
function mathParse(src) {
  var toks = mathTokenize(src);
  var p = 0;
  var peek = function () { return toks[p]; };
  var isOp = function (v) { var t = peek(); return !!t && t.t === 'op' && t.v === v; };

  function expr() {
    var code = term();
    while (true) {
      var t = peek();
      if (!t || t.t !== 'op' || (t.v !== '+' && t.v !== '-')) break;
      p++;
      code = '(' + code + t.v + term() + ')';
    }
    return code;
  }
  function term() {
    var code = unary();
    while (true) {
      var t = peek();
      if (!t) break;
      if (t.t === 'op' && (t.v === '*' || t.v === '/')) {
        p++; code = '(' + code + t.v + unary() + ')';
      } else if (t.t === 'id' || (t.t === 'op' && t.v === '(')) {
        /* 隐式乘法：2x、3(x+1)、(x+1)(x-1)（数字与数字之间不隐式相乘，避免 1.2.3 被静默接受） */
        code = '(' + code + '*' + unary() + ')';
      } else break;
    }
    return code;
  }
  function unary() {
    var t = peek();
    if (t && t.t === 'op' && (t.v === '-' || t.v === '+')) {
      p++;
      var inner = unary();
      return t.v === '-' ? '(-' + inner + ')' : inner;
    }
    return power();
  }
  function power() {
    var base = atom();
    if (isOp('^')) { p++; return 'Math.pow(' + base + ',' + unary() + ')'; }
    return base;
  }
  function callFn(name, args) {
    var spec = MATH_FUNCS[name];
    if (!spec) throw new Error('未知的函数 “' + name + '”');
    if (args.length < spec.min || args.length > spec.max) {
      throw new Error('函数 ' + name + ' 需要 ' + (spec.min === spec.max ? spec.min : spec.min + '~' + spec.max) + ' 个参数');
    }
    if (spec.build) return spec.build(args);
    return spec.js + '(' + args.join(',') + ')';
  }
  function atom() {
    var t = toks[p++];
    if (!t) throw new Error('表达式不完整');
    if (t.t === 'num') return '(' + t.v + ')';
    if (t.t === 'id') {
      if (isOp('(')) {
        p++;
        var args = [];
        if (!isOp(')')) {
          args.push(expr());
          while (isOp(',')) { p++; args.push(expr()); }
        }
        if (!isOp(')')) throw new Error('缺少右括号 “)”');
        p++;
        return callFn(t.v, args);
      }
      if (t.v === 'x' || t.v === 'X') return 'x';
      if (Object.prototype.hasOwnProperty.call(MATH_CONSTS, t.v)) return '(' + MATH_CONSTS[t.v] + ')';
      if (Object.prototype.hasOwnProperty.call(MATH_FUNCS, t.v)) {
        var spec = MATH_FUNCS[t.v];
        var nx = peek();
        var canOmit = spec.min === 1 && spec.max === 1 && nx &&
          (nx.t === 'num' || nx.t === 'id' || (nx.t === 'op' && nx.v === '('));
        /* 单参数函数可省略括号：sin x（√ 已由归一化转成 sqrt） */
        if (canOmit) return callFn(t.v, [unary()]);
        throw new Error('函数 ' + t.v + ' 后面需要括号，例如 ' + t.v + '(x)');
      }
      throw new Error('未知的名称 “' + t.v + '”');
    }
    if (t.t === 'op' && t.v === '(') {
      var e = expr();
      if (!isOp(')')) throw new Error('缺少右括号 “)”');
      p++;
      return '(' + e + ')';
    }
    throw new Error('意外的符号 “' + t.v + '”');
  }

  var code = expr();
  if (p < toks.length) throw new Error('多余的内容 “' + toks[p].v + '”');
  if (!code) throw new Error('请输入表达式');
  return code;
}

/* 编译为 f(x)：返回数值，任何异常都退化为 NaN */
function mathCompile(src) {
  var text = String(src == null ? '' : src).trim();
  if (!text) throw new Error('请输入表达式');
  var code = mathParse(text);
  var raw = new Function('x', 'return (' + code + ');');
  var f = function (x) {
    try {
      var v = raw(x);
      return typeof v === 'number' ? v : NaN;
    } catch (err) {
      return NaN;
    }
  };
  f.source = text;
  f.code = code;
  return f;
}

/* 取一个 “好看” 的刻度间距：1 / 2 / 5 × 10ⁿ */
function niceStep(pxPerUnit, targetPx) {
  var raw = targetPx / pxPerUnit;
  if (!isFinite(raw) || raw <= 0) return { step: 1, m: 1, e: 0 };
  var e = Math.floor(Math.log10(raw));
  var pow = Math.pow(10, e);
  var f = raw / pow;
  var m = f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10;
  var step = m * pow;
  if (m === 10) { m = 1; e += 1; step = pow * 10; }
  return { step: step, m: m, e: e };
}

function fmtTick(v, step) {
  if (!isFinite(v)) return '';
  if (Math.abs(v) < Math.abs(step) * 1e-6) return '0';
  var a = Math.abs(v);
  if (a >= 1e6 || a < 1e-4) {
    return v.toExponential(1).replace('e+', 'e');
  }
  var dec = Math.min(10, Math.max(0, Math.ceil(-Math.log10(Math.abs(step)) - 1e-9)));
  var s = v.toFixed(dec);
  if (s.indexOf('.') >= 0) s = s.replace(/0+$/, '').replace(/\.$/, '');

  return s;

  function drawGrid() {

    if (yAxisVisible) { ctx.moveTo(Math.round(pxX) + 0.5, 0); ctx.lineTo(Math.round(pxX) + 0.5, H); }
    else { ctx.globalAlpha = 0.35; ctx.moveTo(Math.round(baseX) + 0.5, 0); ctx.lineTo(Math.round(baseX) + 0.5, H); ctx.globalAlpha = 1; }

    parts.push('y ∈ [' + fmtReadout(pxToY(H), view.sy) + ', ' + fmtReadout(pxToY(0), view.sy) + ']');
    var gx = niceStep(view.sx, 92), gy = niceStep(view.sy, 66);

      src: src || '',

      visible: true,
      fn: null,
      err: '',
      name: '',
      el: null

    funcs.push(f);

  }

    chip.style.background = f.color;
    var name = document.createElement('span');
    name.className = 'name';
    var input = document.createElement('input');
    input.className = 'src';
    input.type = 'text';
    input.spellcheck = false;
    input.autocomplete = 'off';

    vis.title = '显示 / 隐藏';
    vis.textContent = '◉';
    var del = document.createElement('button');

    hideBadge();
    var raw = e.deltaY;
    if (e.shiftKey && Math.abs(e.deltaX) > Math.abs(raw)) raw = e.deltaX;
    if (e.deltaMode === 1) raw *= 16;
    else if (e.deltaMode === 2) raw *= H;
    var factor = Math.exp(-clamp(raw, -160, 160) * 0.0022);
    var mode = e.shiftKey ? 'x' : (e.altKey ? 'y' : 'both');
    zoomAt(e.offsetX, e.offsetY, factor, mode);
    hover = { x: e.offsetX, y: e.offsetY };
    updateCursor(e.offsetX, e.offsetY);
    requestRender();
  }, { passive: false });

  cv.addEventListener('dblclick', function (e) {
    e.preventDefault();
    zoomAt(e.offsetX, e.offsetY, 1.7);
    requestRender();
  });

  window.addEventListener('keydown', function (e) {
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    var step = e.shiftKey ? 140 : 46;
    var used = true;
    switch (e.key) {
      case 'ArrowLeft': view.ox += step; break;
      case 'ArrowRight': view.ox -= step; break;
      case 'ArrowUp': view.oy += step; break;
      case 'ArrowDown': view.oy -= step; break;
      case '+': case '=': zoomAt(W / 2, H / 2, 1.3); break;
      case '-': case '_': zoomAt(W / 2, H / 2, 1 / 1.3); break;
      case '0': case 'Home': resetView(); break;
      default: used = false;
    }
    if (used) { e.preventDefault(); hideBadge(); requestRender(); }
  });

  var badgeTimer = setTimeout(hideBadge, 9000);
  function hideBadge() {
    clearTimeout(badgeTimer);
    badgeEl.classList.add('hide');
  }

  /* ---------------------------------------------------------------- 工具按钮 */
  document.getElementById('addBtn').addEventListener('click', function () { addFunc(''); });
  document.getElementById('presets').addEventListener('change', function (e) {
    if (!e.target.value) return;
    addFunc(e.target.value);
    e.target.value = '';
  });
  document.getElementById('resetBtn').addEventListener('click', function () {
    resetView();
    requestRender();
  });
  document.getElementById('pngBtn').addEventListener('click', function () {
    noTrace = true;                     /* 导出时不要十字准线和读数气泡 */
    render();
    var url = cv.toDataURL('image/png');
    noTrace = false;
    var a = document.createElement('a');
    a.download = 'function-plot.png';
    a.href = url;
    a.click();
    requestRender();
  });
  /* sx / sy 是“每单位多少像素”，放大 = 每单位像素数变大 */
  document.getElementById('zin').addEventListener('click', function () { zoomAt(W / 2, H / 2, 1.3); requestRender(); });
  document.getElementById('zout').addEventListener('click', function () { zoomAt(W / 2, H / 2, 1 / 1.3); requestRender(); });
  document.getElementById('zreset').addEventListener('click', function () { resetView(); requestRender(); });

  if (window.ResizeObserver) {
    new ResizeObserver(function () { resize(); }).observe(stage);
  } else {
    window.addEventListener('resize', resize);
  }
  window.addEventListener('resize', resize);

  /* ---------------------------------------------------------------- 启动 */
  resize();
  addFunc('sin(x)');
  addFunc('x^2/4 - 2');
  render();
})();
</script>
</body>
</html>
